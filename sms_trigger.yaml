name: Manual SMS Sender

on:
  workflow_dispatch:           # Run manually from the Actions tab
    inputs:
      message:
        description: "SMS text"
        required: false
        default: "Test from GitHub Actions"
  workflow_call:               # Lets other workflows reuse this as an alert
    inputs:
      message:
        type: string
        required: false
        default: "A GitHub Actions workflow needs your attention"

jobs:
  send-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute SMS Script
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          MY_MOBILE_NUMBER: ${{ secrets.MY_MOBILE_NUMBER }}
          SMS_BODY: ${{ inputs.message }}
        run: python send_sms.py
