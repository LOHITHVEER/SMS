name: Manual SMS Sender

on:
  workflow_dispatch:           
    inputs:
      to_number:
        description: "Send to (e.g. +91XXXXXXXXXX)"
        required: true
      from_number:
        description: "Your Twilio number (e.g. +1415XXXXXXX)"
        required: true
      message:
        description: "SMS text"
        required: false
        default: "Test from GitHub Actions"
  workflow_call:               
    inputs:
      to_number:
        type: string
        required: true
      from_number:
        type: string
        required: true
      message:
        type: string
        required: false
        default: "A GitHub Actions workflow needs your attention"

jobs:
  send-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install twilio

      - name: Execute SMS Script
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ inputs.from_number }}
          MY_MOBILE_NUMBER: ${{ inputs.to_number }}
          SMS_BODY: ${{ inputs.message }}
        run: python send_sms.py
